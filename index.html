<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Alone - Private Chat</title>
    
    <script>
        const manifest = {
            "name": "Not Alone",
            "short_name": "Not Alone",
            "description": "Sri Lanka's Private Stranger Chat Platform",
            "start_url": "https://notalone-official.vercel.app/",
            "display": "standalone",
            "background_color": "#0a0514",
            "theme_color": "#0a0514",
            "icons": [
                {
                    "src": "https://raw.githubusercontent.com/anjanachathurangajob-web/notalone-official/main/icon.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CRITICAL: Fixes the 'Same look for everyone' issue */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0514; 
            color: white; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            flex-direction: column; 
        }

        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }

        /* HEADER FIX */
        .chat-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: #0a0514;
        }

        /* MESSAGE AREA FIX - No more overlapping */
        #chat-messages {
            flex: 1; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #chat-messages::-webkit-scrollbar { width: 0; }

        /* INPUT AREA FIX - Sticky Bottom */
        .input-wrapper {
            background: #0a0514;
            padding: 10px 16px 25px 16px; /* Extra bottom padding for modern phones */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .recording { animation: pulse 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* SCREEN WRAPPERS */
        #chat-screen, #main-dashboard, #login-screen, #admin-panel, #searching-ui {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ADMIN_USER = "admin";
        const ADMIN_PW = "913132386V";
        const MY_WHATSAPP = "94773364401";
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let mediaRecorder;
        let audioChunks = [];
        let lastMsgCount = 0;

        window.logout = () => { localStorage.clear(); location.reload(); };

        if(myUser) {
            set(ref(db, `online/${myUser}`), { status: "idle" });
            onDisconnect(ref(db, `online/${myUser}`)).remove();
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
        }

        onValue(ref(db, 'online'), (s) => {
            const count = s.exists() ? Object.keys(s.val()).length : 0;
            document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
        });

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === ADMIN_USER && p === ADMIN_PW) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u); location.reload();
                } else alert("Account Not Approved!");
            } else alert("Invalid Login!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all fields!");
            const check = await get(ref(db, `users/${u}`));
            if(check.exists()) return alert("Username used!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            const msg = `Hi Admin, I just registered on Not Alone.\nUsername: ${u}\nPlease approve my account.`;
            window.location.href = `https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(msg)}`;
            setTimeout(() => location.reload(), 2000);
        };

        window.findStranger = async () => {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('searching-ui').classList.remove('hidden');
            lastMsgCount = 0;

            const queueRef = ref(db, 'queue');
            const myQueueRef = ref(db, `queue/${myUser}`);

            const unsubRoom = onValue(ref(db, `online/${myUser}/room`), (s) => {
                if(s.exists() && s.val()) {
                    remove(myQueueRef);
                    startChat(s.val());
                    unsubRoom();
                }
            });

            const snapshot = await get(queueRef);
            const queue = snapshot.val() || {};
            const partner = Object.keys(queue).find(u => u !== myUser);

            if (partner) {
                const roomId = [myUser, partner].sort().join("_");
                await remove(ref(db, `queue/${partner}`));
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], activeUsers: [myUser, partner], createdAt: Date.now() },
                    [`online/${myUser}`]: { status: "chatting", room: roomId },
                    [`online/${partner}`]: { status: "chatting", room: roomId }
                });
            } else {
                await set(myQueueRef, { joinedAt: Date.now() });
                await update(ref(db, `online/${myUser}`), { status: "searching", room: null });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('searching-ui').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            const msgBox = document.getElementById('chat-messages');

            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                msgBox.innerHTML = "";
                if(s.exists()) {
                    const messages = Object.values(s.val());
                    if(messages.length > lastMsgCount) {
                        const lastMsg = messages[messages.length - 1];
                        if(lastMsg.sender !== myUser) { msgSound.play().catch(e => console.log(e)); }
                    }
                    lastMsgCount = messages.length;
                    messages.forEach(m => {
                        const isMe = m.sender === myUser;
                        let content = m.type === 'text' ? m.text : `<audio controls class="h-8 w-40"><source src="${m.audio}" type="audio/webm"></audio>`;
                        msgBox.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} w-full">
                            <div class="${isMe ? 'bg-pink-600' : 'bg-white/10'} p-3 rounded-2xl max-w-[85%] text-sm shadow-sm">${content}</div>
                        </div>`;
                    });
                    setTimeout(() => { msgBox.scrollTop = msgBox.scrollHeight; }, 100);
                }
            });

            onValue(ref(db, `rooms/${roomId}/activeUsers`), (s) => {
                if(s.exists()) {
                    const active = s.val();
                    if (active.length < 2 && active.includes(myUser)) {
                        if (!document.getElementById('left-msg')) {
                            msgBox.innerHTML += `
                                <div id="left-msg" class="text-center my-6">
                                    <p class="text-red-400 text-[10px] uppercase font-bold mb-3 tracking-widest opacity-60">Partner has left / පාර්ට්නර් ඉවත් විය</p>
                                    <button onclick="findStranger()" class="btn-gradient px-6 py-2 rounded-full text-[10px] font-black uppercase shadow-lg">New Chat / අලුත් කෙනෙක්</button>
                                </div>`;
                            msgBox.scrollTop = msgBox.scrollHeight;
                            currentRoom = null;
                        }
                    }
                }
            });
        }

        window.toggleRecord = async () => {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => { if(currentRoom) push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'voice', audio: reader.result, time: Date.now() }); };
                    };
                    mediaRecorder.start();
                    btn.classList.add('recording'); btn.innerText = "REC";
                } catch(e) { alert("Mic access denied! / මයික්‍රොෆෝනයට අවසර දෙන්න."); }
            } else { mediaRecorder.stop(); btn.classList.remove('recording'); btn.innerText = "VOICE"; }
        };

        window.sendMsg = () => {
            const val = document.getElementById('msg-input').value.trim();
            if(!val || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'text', text: val, time: Date.now() });
            document.getElementById('msg-input').value = "";
        };

        window.endChat = async () => {
            if(!currentRoom) { location.reload(); return; }
            const roomRef = ref(db, `rooms/${currentRoom}`);
            const snapshot = await get(roomRef);
            if(snapshot.exists()) {
                let active = snapshot.val().activeUsers || [];
                active = active.filter(u => u !== myUser);
                active.length === 0 ? await remove(roomRef) : await update(roomRef, { activeUsers: active });
            }
            await update(ref(db, `online/${myUser}`), { status: "idle", room: null });
            location.reload();
        };

        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list'); list.innerHTML = "";
                Object.entries(s.val()).forEach(([u, d]) => {
                    const isApproved = d.approved === true;
                    list.innerHTML += `<div class="p-4 rounded-xl mb-3 flex justify-between items-center ${isApproved ? 'bg-emerald-500/20 border border-emerald-500/30' : 'glass-panel mx-4'}">
                        <div><p class="font-bold text-sm ${isApproved ? 'text-emerald-400' : 'text-white'}">${u}</p></div>
                        <div class="flex gap-2">
                            <button onclick="approveUser('${u}')" class="bg-emerald-600 px-3 py-1 rounded-lg text-[9px] font-bold uppercase">Approve</button>
                            <button onclick="deleteUser('${u}')" class="bg-red-600 px-3 py-1 rounded-lg text-[9px] font-bold uppercase">Del</button>
                        </div>
                    </div>`;
                });
            });
        }
        window.approveUser = (u) => update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + 2592000000 });
        window.deleteUser = (u) => remove(ref(db, `users/${u}`));

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()) {
                    const days = Math.ceil((s.val().expiry - Date.now()) / 86400000);
                    document.getElementById('days-tag').innerText = (days > 0 ? days : 0) + " Days Remaining / ඉතිරි දින";
                    document.getElementById('main-dashboard').classList.remove('hidden');
                } else { logout(); }
            } else document.getElementById('login-screen').classList.remove('hidden');
        };
    </script>

    <div id="searching-ui" class="hidden glass-panel">
        <div class="m-auto text-center">
            <div class="w-16 h-16 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="mt-4 font-bold animate-pulse text-xs uppercase tracking-widest text-pink-500">Searching... සොයමින්...</p>
            <button onclick="location.reload()" class="mt-10 text-[10px] opacity-40 underline uppercase font-bold">Cancel / අවලංගු කරන්න</button>
        </div>
    </div>

    <div id="chat-screen" class="hidden">
        <div class="chat-header">
            <button onclick="logout()" class="text-[9px] text-white/40 uppercase font-bold">Logout / ඉවත් වන්න</button>
            <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full">
                <div class="online-dot animate-pulse"></div><span class="online-count text-[8px] text-emerald-400 font-bold">0 Online</span>
            </div>
            <button onclick="endChat()" class="bg-red-500/10 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/20">End / අවසන්</button>
        </div>
        
        <div id="chat-messages"></div>
        
        <div class="input-wrapper">
            <div class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10 shadow-2xl">
                <button id="record-btn" onclick="toggleRecord()" class="bg-white/10 w-11 h-11 rounded-full text-[8px] font-black uppercase flex-shrink-0">Voice</button>
                <input id="msg-input" placeholder="Message... පණිවිඩය..." class="flex-1 bg-transparent p-2 outline-none text-sm">
                <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[8px] flex-shrink-0">SEND</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden items-center justify-center p-6">
        <div class="w-full max-w-xs">
            <h1 class="text-center text-4xl font-black text-pink-500 mb-8 italic uppercase tracking-tighter">Not Alone</h1>
            <div class="glass-panel p-8 rounded-[2.5rem]">
                <div id="login-box">
                    <input id="login-user" placeholder="Username / නම" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="login-pass" type="password" placeholder="Password / මුරපදය" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase shadow-lg">Login / ඇතුල් වන්න</button>
                    <p onclick="document.getElementById('login-box').classList.add('hidden'); document.getElementById('reg-box').classList.remove('hidden');" class="text-center text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">New Account? / ලියාපදිංචි වන්න</p>
                </div>
                <div id="reg-box" class="hidden">
                    <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase">Register / ලියාපදිංචි වන්න</button>
                    <p onclick="document.getElementById('reg-box').classList.add('hidden'); document.getElementById('login-box').classList.remove('hidden');" class="text-center text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">Back / ආපසු</p>
                </div>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden items-center justify-center p-8">
        <div class="w-full">
            <div class="flex justify-between items-start mb-12">
                <h1 class="text-5xl font-black italic leading-none uppercase tracking-tighter">NOT<br><span class="text-pink-500">ALONE.</span></h1>
                <div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5">
                    <div class="online-dot animate-pulse"></div><span class="online-count text-[9px] text-emerald-400 font-bold uppercase">0 Online</span>
                </div>
            </div>
            <p id="days-tag" class="text-[9px] bg-emerald-500/10 text-emerald-400 px-4 py-1 rounded-full inline-block mb-10 font-black uppercase tracking-widest border border-emerald-500/20">-- Days Remaining</p>
            <button onclick="findStranger()" class="w-full btn-gradient p-14 rounded-[3rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
            <button onclick="logout()" class="w-full mt-10 text-[9px] opacity-20 uppercase font-black tracking-widest">Sign Out / අයින් වන්න</button>
        </div>
    </div>

    <div id="admin-panel" class="hidden p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-blue-500 uppercase italic">Admin Panel</h2>
            <button onclick="location.reload()" class="text-[9px] bg-white/10 px-3 py-1 rounded-full uppercase font-bold">Exit</button>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

</body>
</html>
