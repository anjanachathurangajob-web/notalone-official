<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Clean Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0514; color: white; overflow: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .chat-bubble-me { background: #8b5cf6; border-radius: 18px 18px 4px 18px; }
        .chat-bubble-peer { background: #2d2d3d; border-radius: 18px 18px 18px 4px; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, onDisconnect, remove, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const CLOUD_NAME = "dgxpyzt7c";
        const UPLOAD_PRESET = "notalone_preset";

        let myUser = localStorage.getItem('chatUser');
        let currentChatId = null;
        let mediaRecorder;
        let audioChunks = [];
        let chatListener = null;

        // --- SESSION CLEANUP ---
        window.exitChat = async () => {
            if(myUser) {
                await update(ref(db, `users/${myUser}`), { currentChat: null, chattingWith: null });
                if(currentChatId) off(ref(db, `messages/${currentChatId}`));
            }
            location.reload();
        };

        window.logout = () => {
            localStorage.removeItem('chatUser');
            location.reload();
        };

        // --- VOICE LOGIC ---
        window.uploadVoice = async (blob) => {
            if(!currentChatId) return;
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            push(ref(db, `messages/${currentChatId}`), { u: myUser, t: data.secure_url, type: 'audio', ts: Date.now() });
        };

        window.toggleRecord = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => uploadVoice(new Blob(audioChunks, { type: 'audio/webm' }));
                mediaRecorder.start();
                document.getElementById('mic-btn').classList.add('text-red-500', 'animate-pulse');
            } else {
                mediaRecorder.stop();
                document.getElementById('mic-btn').classList.remove('text-red-500', 'animate-pulse');
            }
        };

        // --- CHAT CORE ---
        function openChatUI(chatId, peer) {
            currentChatId = chatId;
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('peer-name').innerText = peer;

            chatListener = onValue(ref(db, `messages/${chatId}`), (s) => {
                const b = document.getElementById('messages');
                b.innerHTML = "";
                if(s.exists()){
                    const now = Date.now();
                    Object.entries(s.val()).forEach(([key, m]) => {
                        if(m.type === 'text' && (now - m.ts > 259200000)) { remove(ref(db, `messages/${chatId}/${key}`)); return; }
                        const isMe = m.u === myUser;
                        let content = `<p class="text-sm">${m.t}</p>`;
                        if(m.type === 'audio') content = `<audio src="${m.t}" controls class="h-8" onended="remove(ref(db,'messages/${chatId}/${key}'))"></audio>`;
                        
                        b.innerHTML += `<div class="flex ${isMe?'justify-end':'justify-start'} mb-4">
                            <div class="${isMe?'chat-bubble-me':'chat-bubble-peer'} px-4 py-2 max-w-[85%] shadow-xl">${content}</div>
                        </div>`;
                    });
                    b.scrollTop = b.scrollHeight;
                }
            });
        }

        window.startChatting = async () => {
            // "Find Someone" එබූ විගස පරණ දත්ත මකා දැමීම
            await update(ref(db, `users/${myUser}`), { currentChat: null, chattingWith: null });
            
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            const qSnap = await get(ref(db, 'queue'));
            if(qSnap.exists()){
                const peer = Object.keys(qSnap.val()).find(u => u !== myUser);
                if(peer){
                    const cid = `chat_${Date.now()}`;
                    await update(ref(db, `users/${peer}`), { currentChat: cid, chattingWith: myUser });
                    await update(ref(db, `users/${myUser}`), { currentChat: cid, chattingWith: peer });
                    await remove(ref(db, `queue/${peer}`));
                    return;
                }
            }
            await set(ref(db, `queue/${myUser}`), true);
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
        };

        window.sendMsg = () => {
            const i = document.getElementById('msg-input');
            if(i.value && currentChatId) {
                push(ref(db, `messages/${currentChatId}`), { u: myUser, t: i.value, type: 'text', ts: Date.now() });
                i.value = "";
            }
        };

        window.handleLogin = async () => {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) { localStorage.setItem('chatUser', u); location.reload(); }
            else alert("Error");
        };

        window.onload = () => {
            if(!myUser) document.getElementById('login-screen').classList.remove('hidden');
            else {
                document.getElementById('main-dashboard').classList.remove('hidden');
                // වැදගත්: මෙහිදී auto-load වීම නැවැත්වීමට currentChat එක check කරන්නේ නැත.
                // ලොජික් එක පාලනය වන්නේ startChatting හරහා පමණි.
                onValue(ref(db, `users/${myUser}`), (s) => {
                    const data = s.val();
                    if(data?.currentChat && !currentChatId) {
                        openChatUI(data.currentChat, data.chattingWith);
                    }
                });
            }
        };
    </script>

    <div id="login-screen" class="screen hidden flex-1 flex flex-col justify-center max-w-sm mx-auto text-center">
        <h1 class="text-4xl font-black italic text-blue-500 mb-8 uppercase">Not Alone</h1>
        <div class="glass-panel p-8 rounded-[2.5rem]">
            <input id="username" placeholder="Username" class="w-full bg-white/5 p-4 rounded-2xl mb-4 outline-none border border-white/5">
            <input id="password" type="password" placeholder="Password" class="w-full bg-white/5 p-4 rounded-2xl mb-6 outline-none border border-white/5">
            <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-black uppercase tracking-widest">Login</button>
        </div>
    </div>

    <div id="main-dashboard" class="screen hidden flex-1 flex flex-col justify-center">
        <div class="flex justify-between items-start mb-12">
            <h1 class="text-6xl font-black italic uppercase leading-[0.85]">Voice<br><span class="text-pink-500">Only.</span></h1>
            <button onclick="logout()" class="text-[10px] border border-white/20 px-4 py-2 rounded-full uppercase">Logout</button>
        </div>
        <button onclick="startChatting()" class="w-full btn-gradient p-10 rounded-[2.5rem] font-black text-2xl shadow-2xl uppercase tracking-tighter">Find Someone →</button>
    </div>

    <div id="chat-screen" class="screen hidden fixed inset-0 bg-[#0a0514] p-6 flex flex-col z-50">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black italic text-blue-500 uppercase">Not Alone</h2>
            <div class="flex items-center gap-3">
                <span id="peer-name" class="text-[10px] font-bold text-purple-400 uppercase tracking-widest"></span>
                <button onclick="exitChat()" class="text-[9px] bg-red-500/20 text-red-500 px-3 py-1 rounded-full uppercase font-bold">End Chat</button>
            </div>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto mb-6 space-y-4"></div>
        <div class="glass-panel p-2 rounded-[2.5rem] shadow-2xl">
            <div class="flex justify-center py-3 border-b border-white/5 mb-1">
                <button id="mic-btn" onclick="toggleRecord()" class="text-3xl p-4 bg-white/5 rounded-full transition-all active:scale-90">🎙️</button>
            </div>
            <div class="flex gap-2 p-1">
                <input id="msg-input" placeholder="Say something..." class="flex-1 bg-transparent p-4 outline-none text-sm" onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()" class="btn-gradient px-8 rounded-2xl font-black text-xs uppercase">Send</button>
            </div>
        </div>
    </div>

    <div id="loading-screen" class="screen hidden flex-1 flex flex-col items-center justify-center">
        <div class="w-14 h-14 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-xs uppercase opacity-50 tracking-widest animate-pulse">Searching for a voice...</p>
        <button onclick="exitChat()" class="mt-12 text-[10px] opacity-30 underline uppercase">Cancel</button>
    </div>

</body>
</html>
