<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not Alone - Private Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0514; color: white; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; width: 100vw; }

        /* HEADER */
        .chat-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0a0514; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; }

        /* MESSAGE AREA */
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        #chat-messages::-webkit-scrollbar { width: 0; }

        /* INPUT AREA */
        .input-wrapper { padding: 10px 16px 25px 16px; background: #0a0514; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; padding-bottom: max(25px, env(safe-area-inset-bottom)); }

        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .hidden { display: none !important; }
        .msg-me { background: #ec4899; align-self: flex-end; border-radius: 18px 18px 2px 18px; }
        .msg-stranger { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-radius: 18px 18px 18px 2px; }
        .msg-bubble { padding: 10px 15px; max-width: 80%; font-size: 14px; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="login-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6">
            <h1 class="text-4xl font-black text-pink-500 mb-8 italic uppercase">Not Alone</h1>
            <div class="glass-panel p-8 rounded-[2.5rem] w-full max-w-xs text-center">
                <div id="login-box">
                    <input id="login-user" placeholder="Username / නම" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="login-pass" type="password" placeholder="Password / මුරපදය" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase shadow-lg">Login / ඇතුල් වන්න</button>
                    <p onclick="toggleReg(true)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold tracking-widest">Register / ලියාපදිංචි වන්න</p>
                </div>
                <div id="reg-box" class="hidden">
                    <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase shadow-lg">Register / ලියාපදිංචි වන්න</button>
                    <p onclick="toggleReg(false)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold tracking-widest">Back / ආපසු</p>
                </div>
            </div>
        </div>

        <div id="main-dashboard" class="hidden flex-1 flex flex-col items-center justify-center p-8">
            <div class="w-full flex justify-between absolute top-0 p-6">
                <button onclick="logout()" class="text-[10px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold">Logout</button>
                <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-[10px] font-bold border border-emerald-500/20">
                    <span class="online-count">0</span> ONLINE
                </div>
            </div>
            <h1 class="text-5xl font-black italic mb-2 text-pink-500 uppercase">NOT ALONE.</h1>
            <p id="days-tag" class="text-[9px] opacity-40 uppercase tracking-widest mb-10">-- Days Remaining</p>
            <button onclick="findStranger()" class="w-full btn-gradient p-14 rounded-[3rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
        </div>

        <div id="searching-ui" class="hidden flex-1 flex flex-col items-center justify-center">
            <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 font-bold text-xs uppercase tracking-widest">Searching... සොයමින්...</p>
            <button onclick="location.reload()" class="mt-10 text-[10px] opacity-40 underline uppercase font-bold">Cancel</button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full">
            <div class="chat-header">
                <button onclick="logout()" class="text-[9px] text-white/40 uppercase font-bold">Logout</button>
                <span class="text-[10px] font-bold text-pink-500 uppercase online-count">0 Online</span>
                <button onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/30">End</button>
            </div>
            <div id="chat-messages"></div>
            <div class="input-wrapper">
                <div class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10 shadow-2xl">
                    <button id="record-btn" onclick="toggleRecord()" class="bg-white/10 w-11 h-11 rounded-full text-[8px] font-black uppercase">Voice</button>
                    <input id="msg-input" placeholder="Message... පණිවිඩය..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[8px]">SEND</button>
                </div>
            </div>
        </div>

        <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-blue-500 uppercase italic">Admin Panel</h2>
                <button onclick="location.reload()" class="text-[9px] bg-white/10 px-3 py-1 rounded-full">Exit</button>
            </div>
            <div id="user-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_USER = "admin";
        const ADMIN_PW = "913132386V";
        const MY_WHATSAPP = "94773364401";

        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;

        window.toggleReg = (show) => {
            document.getElementById('login-box').classList.toggle('hidden', show);
            document.getElementById('reg-box').classList.toggle('hidden', !show);
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        if(myUser) {
            onValue(ref(db, 'online'), (s) => {
                const count = s.exists() ? Object.keys(s.val()).length : 0;
                document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
            });
        }

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === ADMIN_USER && p === ADMIN_PW) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u); location.reload();
                } else alert("Not Approved! / අනුමත කර නැත.");
            } else alert("Invalid Login!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all fields!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            const msg = `Hi Admin, Approve me.\nUsername: ${u}`;
            window.location.href = `https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(msg)}`;
        };

        window.findStranger = async () => {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('searching-ui').classList.remove('hidden');
            await set(ref(db, `queue/${myUser}`), { joinedAt: Date.now() });
            
            onValue(ref(db, `online/${myUser}/room`), (s) => {
                if(s.exists()) startChat(s.val());
            });

            const snapshot = await get(ref(db, 'queue'));
            const partner = Object.keys(snapshot.val() || {}).find(u => u !== myUser);
            if(partner) {
                const roomId = [myUser, partner].sort().join("_");
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], createdAt: Date.now() },
                    [`online/${myUser}/room`]: roomId, [`online/${partner}/room`]: roomId,
                    [`queue/${myUser}`]: null, [`queue/${partner}`]: null
                });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('searching-ui').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = "";
                if(s.exists()) {
                    Object.values(s.val()).forEach(m => {
                        const isMe = m.sender === myUser;
                        box.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-me' : 'msg-stranger'}">${m.text}</div>`;
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msg-input');
            if(!inp.value || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, text: inp.value, time: Date.now() });
            inp.value = "";
        };

        window.endChat = () => { location.reload(); };

        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list'); list.innerHTML = "";
                Object.entries(s.val()).forEach(([u, d]) => {
                    list.innerHTML += `<div class="p-4 glass-panel rounded-xl mb-2 flex justify-between">
                        <div><p>${u}</p><p class="text-[9px]">Status: ${d.approved ? 'Active' : 'Pending'}</p></div>
                        <button onclick="approve('${u}')" class="bg-emerald-600 px-3 py-1 rounded text-[10px]">Approve</button>
                    </div>`;
                });
            });
        }
        window.approve = (u) => update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + 2592000000 });

        window.onload = () => {
            if(!myUser) document.getElementById('login-screen').classList.remove('hidden');
            else document.getElementById('main-dashboard').classList.remove('hidden');
        };
    </script>
</body>
</html>
