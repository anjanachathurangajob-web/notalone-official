<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Omegle Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            messagingSenderId: "541160542822",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentChatId = null;
        let myUser = localStorage.getItem('chatUser');

        // --- AUTH & LOGOUT ---
        window.logout = () => { localStorage.clear(); location.reload(); };

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(user === "admin" && pass === "913132386V") {
                localStorage.setItem('isAdmin', 'true');
                location.reload();
                return;
            }
            const snapshot = await get(ref(db, 'users/' + user));
            if (snapshot.exists() && snapshot.val().password === pass && snapshot.val().isPaid) {
                localStorage.setItem('chatUser', user);
                location.reload();
            } else { alert("Login failed. Check status or details."); }
        };

        // --- MATCHING ENGINE ---
        window.findChat = async () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            
            // Cleanup old states
            if(myUser) await update(ref(db, `users/${myUser}`), { currentChat: null });

            const queueRef = ref(db, 'queue');
            const snapshot = await get(queueRef);
            
            if (snapshot.exists()) {
                const queue = snapshot.val();
                const peerId = Object.keys(queue)[0];
                if (peerId !== myUser) {
                    const chatId = `chat_${peerId}_${myUser}`;
                    await update(ref(db, `users/${peerId}`), { currentChat: chatId });
                    await update(ref(db, `users/${myUser}`), { currentChat: chatId });
                    await remove(ref(db, `queue/${peerId}`));
                    return; // StartChat triggered by listener
                }
            }
            await set(ref(db, `queue/${myUser}`), true);
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
        };

        // --- CHAT SESSION ---
        function startChat(chatId) {
            currentChatId = chatId;
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('msg-input').focus();
            
            const chatMsgRef = ref(db, `messages/${chatId}`);
            onValue(chatMsgRef, (s) => {
                const b = document.getElementById('messages'); b.innerHTML = "";
                s.forEach(c => {
                    const m = c.val();
                    if(m.u) {
                        const isMe = m.u === myUser;
                        b.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                            <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} px-4 py-2 rounded-2xl max-w-[85%]">
                                <p class="text-sm">${m.t}</p>
                            </div></div>`;
                    }
                });
                b.scrollTop = b.scrollHeight;
                if(s.val()?.status === 'ended') {
                    document.getElementById('status-text').innerText = "Stranger disconnected.";
                    document.getElementById('msg-area').classList.add('hidden');
                    document.getElementById('end-options').classList.remove('hidden');
                }
            });
        }

        window.sendMsg = () => {
            const t = document.getElementById('msg-input').value;
            if(t && currentChatId) {
                push(ref(db, `messages/${currentChatId}`), { u: myUser, t: t });
                document.getElementById('msg-input').value = "";
            }
        };

        window.skipChat = async () => {
            if(currentChatId) {
                await set(ref(db, `messages/${currentChatId}/status`), 'ended');
                await update(ref(db, `users/${myUser}`), { currentChat: null });
            }
            location.reload();
        };

        // --- INITIALIZE ---
        window.onload = () => {
            if(!myUser) document.getElementById('login-screen').classList.remove('hidden');
            else {
                document.getElementById('start-screen').classList.remove('hidden');
                onValue(ref(db, `users/${myUser}/currentChat`), (s) => {
                    if(s.exists() && s.val()) startChat(s.val());
                });
            }
        };

    </script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <div id="login-screen" class="hidden flex-1 flex items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-[2rem] w-full max-w-sm border border-slate-700 text-center">
            <h1 class="text-3xl font-black text-blue-400 italic mb-8">Not Alone</h1>
            <input id="username" placeholder="Username" class="w-full bg-slate-900 p-4 rounded-xl mb-4 outline-none border border-slate-700">
            <input id="password" type="password" placeholder="Password" class="w-full bg-slate-900 p-4 rounded-xl mb-6 outline-none border border-slate-700">
            <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold">Log In</button>
        </div>
    </div>

    <div id="start-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6 relative">
        <button onclick="logout()" class="absolute top-6 right-6 text-gray-500 text-xs">Logout</button>
        <h1 class="text-5xl font-black text-blue-500 italic mb-2">Not Alone</h1>
        <p class="text-gray-400 mb-12">Talk to strangers!</p>
        <button onclick="findChat()" class="bg-white text-black px-10 py-5 rounded-full text-xl font-black shadow-2xl hover:bg-blue-400 transition-all">Find Chat</button>
    </div>

    <div id="loading-screen" class="hidden flex-1 flex flex-col items-center justify-center relative">
        <button onclick="logout()" class="absolute top-6 right-6 text-gray-500 text-xs">Logout</button>
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-blue-400 font-bold">Looking for someone...</p>
    </div>

    <div id="chat-screen" class="hidden flex flex-col h-full">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <span id="status-text" class="text-xs font-bold text-green-500 italic">● You're now chatting with a stranger.</span>
            <button onclick="logout()" class="text-[10px] text-gray-500 uppercase">Logout</button>
        </div>
        
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900"></div>

        <div id="end-options" class="hidden p-8 text-center bg-slate-800 border-t border-slate-700">
            <button onclick="location.reload()" class="bg-blue-600 px-8 py-3 rounded-full font-bold">Start a New Chat</button>
        </div>

        <div id="msg-area" class="p-4 bg-slate-800 border-t border-slate-700 flex gap-2">
            <button onclick="skipChat()" class="bg-red-900/30 text-red-400 px-4 rounded-xl font-bold text-xs border border-red-900/50">Skip</button>
            <input id="msg-input" placeholder="Type message..." class="flex-1 bg-slate-900 p-4 rounded-xl outline-none border border-slate-700" onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-xl font-bold">Send</button>
        </div>
    </div>

</body>
</html>
