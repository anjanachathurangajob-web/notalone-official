<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #0a0514; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // --- FIXED DATA ---
        const ADMIN_USER = "admin";
        const ADMIN_PW = "913132386V";
        const MY_WHATSAPP = "94773364401";

        let myUser = localStorage.getItem('chatUser');

        // Online Tracking
        if(myUser) {
            set(ref(db, `online/${myUser}`), true);
            onDisconnect(ref(db, `online/${myUser}`)).remove();
        }
        onValue(ref(db, 'online'), (s) => {
            const count = s.exists() ? Object.keys(s.val()).length : 0;
            document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
        });

        // Register Logic
        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all details!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            window.open(`https://wa.me/${MY_WHATSAPP}?text=New user request: ${u}`, '_blank');
            alert("Registration requested! Waiting for Admin Approval.");
        };

        // Login Logic
        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            
            if(u === ADMIN_USER && p === ADMIN_PW) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData();
                return;
            }

            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                const userData = s.val();
                if(userData.approved && Date.now() < userData.expiry) {
                    localStorage.setItem('chatUser', u);
                    location.reload();
                } else {
                    alert("Account pending approval or expired!");
                }
            } else { alert("Invalid Credentials"); }
        };

        // Admin Approval Logic (Approve 30 Days)
        window.approveUser = async (u) => {
            const thirtyDays = 30 * 24 * 60 * 60 * 1000;
            await update(ref(db, `users/${u}`), { 
                approved: true, 
                expiry: Date.now() + thirtyDays 
            });
            alert(u + " approved for 30 days!");
        };

        // Load Users into Admin Panel
        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                if(s.exists()){
                    Object.entries(s.val()).forEach(([u, d]) => {
                        list.innerHTML += `
                            <div class="glass-panel p-4 rounded-xl mb-3 flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-sm text-white">${u}</p>
                                    <p class="text-[10px] opacity-60">PW: ${d.password} | Exp: ${d.expiry ? new Date(d.expiry).toLocaleDateString() : 'N/A'}</p>
                                </div>
                                <button onclick="approveUser('${u}')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-[10px] font-black uppercase">
                                    Approve 30D
                                </button>
                            </div>`;
                    });
                }
            });
        }

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()) {
                    document.getElementById('expire-tag').innerText = "Expire: " + new Date(s.val().expiry).toLocaleDateString();
                }
                document.getElementById('main-dashboard').classList.remove('hidden');
            } else { document.getElementById('login-screen').classList.remove('hidden'); }
        };
        
        window.logout = () => { localStorage.removeItem('chatUser'); location.reload(); };
    </script>

    <!-- UI: LOGIN & REGISTER -->
    <div id="login-screen" class="hidden flex-1 flex flex-col justify-center max-w-sm mx-auto">
        <h1 class="text-4xl font-black text-pink-500 mb-8 text-center uppercase tracking-tighter">NOT ALONE</h1>
        <div class="glass-panel p-8 rounded-3xl">
            <div id="login-form">
                <input id="login-user" placeholder="Username" class="w-full bg-white/5 p-4 mb-4 rounded-xl outline-none border border-white/5 focus:border-pink-500/50 transition-all text-sm">
                <input id="login-pass" type="password" placeholder="Password" class="w-full bg-white/5 p-4 mb-6 rounded-xl outline-none border border-white/5 focus:border-pink-500/50 transition-all text-sm">
                <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-xl font-bold uppercase shadow-lg shadow-pink-500/20">Login</button>
                <p class="text-center text-[10px] opacity-40 mt-4 uppercase cursor-pointer hover:opacity-100 transition-all" onclick="document.getElementById('login-form').classList.add('hidden'); document.getElementById('reg-form').classList.remove('hidden');">New account? Register</p>
            </div>
            <div id="reg-form" class="hidden text-center">
                <input id="reg-user" placeholder="Create Username" class="w-full bg-white/5 p-4 mb-2 rounded-xl outline-none border border-white/5 text-sm">
                <input id="reg-pass" placeholder="Create Password" class="w-full bg-white/5 p-4 mb-4 rounded-xl outline-none border border-white/5 text-sm">
                <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold uppercase">Register</button>
                <p class="text-[10px] opacity-40 mt-4 uppercase cursor-pointer hover:opacity-100 transition-all" onclick="document.getElementById('reg-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden');">Back to Login</p>
            </div>
        </div>
    </div>

    <!-- UI: MAIN DASHBOARD -->
    <div id="main-dashboard" class="hidden flex-1 flex flex-col justify-center">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-5xl font-black italic leading-[0.8]">NOT<br><span class="text-pink-500 uppercase">ALONE.</span></h1>
            <div class="flex flex-col items-end gap-2">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold hover:bg-white/5">Logout</button>
                <div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5">
                    <div class="online-dot animate-pulse"></div><span class="online-count text-[10px] font-bold text-emerald-400 uppercase tracking-widest">0 Online</span>
                </div>
            </div>
        </div>
        <p id="expire-tag" class="text-pink-400 font-black mb-8 uppercase tracking-[0.2em] text-[10px] bg-pink-500/10 self-start px-4 py-1 rounded-full border border-pink-500/20">Expire: --</p>
        <button class="w-full btn-gradient p-12 rounded-[2.5rem] font-black text-2xl uppercase shadow-2xl shadow-pink-500/30 transform active:scale-95 transition-all">Find Stranger →</button>
    </div>

    <!-- UI: ADMIN PANEL -->
    <div id="admin-panel" class="hidden flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-blue-500 uppercase">Admin Control</h2>
            <button onclick="location.reload()" class="bg-white/10 px-3 py-1 rounded-full text-[9px] font-bold uppercase">Exit</button>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto pb-10 pr-2">
            <!-- User list will be injected here -->
        </div>
    </div>

</body>
</html>
