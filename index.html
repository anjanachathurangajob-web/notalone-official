<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not Alone - Admin Delete Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0514; color: white; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; width: 100vw; }
        .chat-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0a0514; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .input-wrapper { padding: 10px 16px; background: #0a0514; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        .msg-me { background: #ec4899; align-self: flex-end; border-radius: 18px 18px 2px 18px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        .msg-stranger { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-radius: 18px 18px 18px 2px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        
        #finding-overlay { position: fixed; inset: 0; background: #0a0514; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader-ring { width: 80px; height: 80px; border: 4px solid rgba(236, 72, 153, 0.1); border-top: 4px solid #ec4899; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #left-alert-box { position: absolute; top: 70px; left: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; border-radius: 2rem; background: rgba(255, 0, 0, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255,0,0,0.3); text-align: center; }
        .system-msg { align-self: center; background: rgba(16, 185, 129, 0.1); color: #10b981; font-size: 10px; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; }
        .top-logout { position: absolute; top: 20px; left: 20px; z-index: 110; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="finding-overlay" class="hidden">
            <button onclick="location.reload()" class="top-logout text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold text-white/40">Cancel / අවලංගු කරන්න</button>
            <div class="loader-ring"></div>
            <h2 class="text-xl font-black italic text-pink-500 uppercase">Searching...<br><span class="text-lg">සොයමින් පවතියි...</span></h2>
            <p class="text-[10px] opacity-40 mt-4 uppercase">Waiting for a stranger / රැඳී සිටින්න</p>
        </div>

        <div id="main-dashboard" class="hidden flex-1 flex flex-col items-center justify-center p-8">
            <div class="w-full flex justify-between absolute top-0 p-6 items-center">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold text-white/40">Logout / අයින් වන්න</button>
                <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-[9px] font-bold border border-emerald-500/20">
                    <span class="online-count">0</span> ONLINE
                </div>
            </div>
            <h1 class="text-6xl font-black italic mb-2 text-pink-500 uppercase tracking-tighter text-center">NOT ALONE.</h1>
            <p id="days-tag" class="text-[10px] bg-white/5 px-4 py-1 rounded-full mb-12 font-bold tracking-widest">-- Days Remaining</p>
            <button onclick="findStranger()" class="w-full btn-gradient p-14 rounded-[3rem] font-black text-xl uppercase shadow-2xl active:scale-95 transition-all text-center">Find Stranger<br><span class="text-sm opacity-70">හිතවතෙකු සොයන්න</span></button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full relative">
            <div id="left-alert-box" class="hidden">
                <h2 class="text-2xl font-black text-red-500 uppercase italic">Stranger Left!<br><span class="text-lg">හිතවතා ඉවත් විය!</span></h2>
                <button onclick="location.reload()" class="btn-gradient w-full py-4 rounded-3xl font-black text-sm uppercase shadow-lg mt-6">Start New Chat<br><span class="text-[10px]">අලුත් හිතවතෙකු සොයන්න</span></button>
                <button onclick="logout()" class="mt-4 text-[9px] opacity-40 uppercase font-bold">Logout / අයින් වන්න</button>
            </div>

            <div class="chat-header">
                <button onclick="logout()" class="text-[8px] text-white/40 uppercase font-bold">Logout</button>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-black text-pink-500 uppercase">Chatting / පණිවිඩ හුවමාරුව</span>
                    <span class="text-[8px] text-emerald-400 font-bold online-count">0 Online</span>
                </div>
                <button id="end-btn" onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/30">End Chat</button>
            </div>

            <div id="chat-messages"></div>

            <div id="chat-input-area" class="input-wrapper">
                <div id="input-container" class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10">
                    <button class="bg-white/10 w-11 h-11 rounded-full text-[7px] font-black uppercase">Voice</button>
                    <input id="msg-input" placeholder="Type here... මෙහි ලියන්න..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[7px] uppercase">Send<br>යවන්න</button>
                </div>
            </div>
        </div>

        <div id="login-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-4xl font-black text-pink-500 mb-8 italic uppercase tracking-tighter">Not Alone</h1>
            <div class="glass-panel p-8 rounded-[2.5rem] w-full max-w-xs">
                <div id="login-box">
                    <input id="login-user" placeholder="Username / නම" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5 text-white">
                    <input id="login-pass" type="password" placeholder="Password / මුරපදය" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5 text-white">
                    <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase">Login / ඇතුල් වන්න</button>
                    <p onclick="toggleReg(true)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold tracking-widest">Register / ලියාපදිංචි වන්න</p>
                </div>
                <div id="reg-box" class="hidden">
                    <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5 text-white">
                    <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5 text-white">
                    <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase text-[11px]">Register & WhatsApp</button>
                    <p onclick="toggleReg(false)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold tracking-widest">Back / ආපසු</p>
                </div>
            </div>
        </div>

        <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-y-auto bg-black">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-black text-blue-500 uppercase italic">Admin Panel</h2>
                <button onclick="location.reload()" class="text-[9px] border border-white/20 px-4 py-2 rounded-full uppercase font-bold">Exit Admin</button>
            </div>
            <div id="user-list" class="space-y-4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const MY_WHATSAPP = "94773364401";
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let lastMsgCount = 0;

        window.logout = () => { localStorage.clear(); location.reload(); };
        window.toggleReg = (s) => {
            document.getElementById('login-box').classList.toggle('hidden', s);
            document.getElementById('reg-box').classList.toggle('hidden', !s);
        };

        if(myUser) {
            onValue(ref(db, 'online'), (s) => {
                const count = s.exists() ? Object.keys(s.val()).length : 0;
                document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
            });
            set(ref(db, `online/${myUser}`), { status: "idle" });
            onDisconnect(ref(db, `online/${myUser}`)).remove();
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
        }

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === "admin" && p === "913132386V") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u); location.reload();
                } else alert("Not Approved! / අනුමත කර නැත!");
            } else alert("Login Failed! / ඇතුල් වීම අසාර්ථකයි!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all! / සියල්ල පුරවන්න!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            const waMsg = `Hi Admin, I just registered on Not Alone.\nUsername: ${u}\nPlease approve my account.`;
            window.location.href = `https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(waMsg)}`;
        };

        window.findStranger = async () => {
            document.getElementById('finding-overlay').classList.remove('hidden');
            const queueSnap = await get(ref(db, 'queue'));
            let partner = null;
            if (queueSnap.exists()) {
                partner = Object.keys(queueSnap.val()).find(u => u !== myUser);
            }

            if (partner) {
                const roomId = [myUser, partner].sort().join("_");
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], active: true },
                    [`online/${myUser}/room`]: roomId,
                    [`online/${partner}/room`]: roomId,
                    [`queue/${partner}`]: null
                });
                startChat(roomId);
            } else {
                await set(ref(db, `queue/${myUser}`), { joinedAt: Date.now() });
                const roomListener = ref(db, `online/${myUser}/room`);
                onValue(roomListener, (s) => {
                    if (s.exists()) {
                        off(roomListener);
                        startChat(s.val());
                    }
                });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('finding-overlay').classList.add('hidden');
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            const msgBox = document.getElementById('chat-messages');
            msgBox.innerHTML = '<div class="system-msg">Connected / සම්බන්ධ විය</div>';

            onValue(ref(db, `rooms/${roomId}`), (s) => {
                if(!s.exists()) {
                    document.getElementById('left-alert-box').classList.remove('hidden');
                    document.getElementById('input-container').style.opacity = "0.2";
                    document.getElementById('input-container').style.pointerEvents = "none";
                    document.getElementById('end-btn').classList.add('hidden');
                }
            });

            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                if(s.exists()){
                    const msgs = Object.values(s.val());
                    msgBox.innerHTML = '<div class="system-msg">Connected / සම්බන්ධ විය</div>';
                    msgs.forEach(m => {
                        msgBox.innerHTML += `<div class="${m.sender === myUser ? 'msg-me' : 'msg-stranger'}">${m.text}</div>`;
                    });
                    if(msgs.length > lastMsgCount && msgs[msgs.length-1].sender !== myUser) msgSound.play();
                    lastMsgCount = msgs.length;
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msg-input');
            if(!inp.value || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, text: inp.value });
            inp.value = "";
        };

        window.endChat = () => { if(currentRoom) remove(ref(db, `rooms/${currentRoom}`)); location.reload(); };

        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list'); list.innerHTML = "";
                if(s.exists()) {
                    Object.entries(s.val()).forEach(([u, d]) => {
                        if(u === "admin") return;
                        const isApproved = d.approved && Date.now() < d.expiry;
                        list.innerHTML += `<div class="p-4 glass-panel rounded-2xl flex justify-between items-center border ${isApproved ? 'border-emerald-500/50' : 'border-white/5'}">
                            <div>
                                <p class="font-bold ${isApproved ? 'text-emerald-400' : 'text-pink-500'}">${u}</p>
                                <p class="text-[8px] opacity-40">${isApproved ? 'APPROVED' : 'PENDING'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="approve('${u}')" class="${isApproved ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-emerald-600 text-white'} px-3 py-2 rounded-xl text-[10px] font-black uppercase">
                                    ${isApproved ? 'Extend' : 'Approve'}
                                </button>
                                <button onclick="deleteUser('${u}')" class="bg-red-500/20 text-red-500 border border-red-500/30 px-3 py-2 rounded-xl text-[10px] font-black uppercase">
                                    Del
                                </button>
                            </div>
                        </div>`;
                    });
                }
            });
        }
        window.approve = (u) => update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + 2592000000 });
        window.deleteUser = (u) => { if(confirm(`Delete ${u}?`)) remove(ref(db, `users/${u}`)); };

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()){
                    const d = Math.ceil((s.val().expiry - Date.now())/86400000);
                    document.getElementById('days-tag').innerText = (d > 0 ? d : 0) + " Days Remaining / දින ඉතිරිව ඇත";
                    document.getElementById('main-dashboard').classList.remove('hidden');
                } else logout();
            } else document.getElementById('login-screen').classList.remove('hidden');
        };
    </script>
</body>
</html>
