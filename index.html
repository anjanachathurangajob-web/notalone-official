<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Alone - UI Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* FULL FIX FOR SCREEN OVERLAP */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Screen එක එහා මෙහා හෙල්ලෙන්නේ නැති වෙන්න */
            background: #0a0514;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh; /* Device එකේ උසට සමානයි */
            height: -webkit-fill-available; /* iOS Fix */
            width: 100vw;
        }

        /* HEADER */
        .chat-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #0a0514;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0; /* Header එක කුඩා වෙන්න දෙන්නේ නැහැ */
        }

        /* MESSAGE AREA - මේක තමයි මැද කොටස */
        #chat-messages {
            flex-grow: 1; /* ඉතිරි ඉඩ සම්පූර්ණයෙන්ම ගනී */
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        #chat-messages::-webkit-scrollbar { width: 0; }

        /* INPUT AREA FIX - කීබෝඩ් එකට යට වෙන්නේ නැති වෙන්න */
        .input-wrapper {
            padding: 12px 16px;
            background: #0a0514;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0; /* Input එක හැමවෙලේම පෙනෙන්න තියෙයි */
            margin-bottom: env(safe-area-inset-bottom); /* iPhone notch fix */
        }

        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="main-dashboard" class="flex-1 flex flex-col justify-center p-8">
            <h1 class="text-5xl font-black italic mb-8 uppercase tracking-tighter text-pink-500">Not Alone.</h1>
            <button onclick="startChatUI()" class="btn-gradient p-12 rounded-[2.5rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full">
            <div class="chat-header">
                <span class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">Stranger Chat</span>
                <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/20">End</button>
            </div>

            <div id="chat-messages">
                <div class="flex justify-start">
                    <div class="bg-white/10 p-3 rounded-2xl max-w-[85%] text-sm">Hi! How are you?</div>
                </div>
            </div>

            <div class="input-wrapper">
                <div class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10 shadow-2xl">
                    <button class="bg-white/10 w-11 h-11 rounded-full text-[8px] font-black uppercase flex-shrink-0">Voice</button>
                    <input id="msg-input" placeholder="Message..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button class="btn-gradient w-11 h-11 rounded-full font-black text-[8px] flex-shrink-0">SEND</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function startChatUI() {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            // Scroll messages to bottom on start
            const msgBox = document.getElementById('chat-messages');
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        // Keyboard පාවිච්චි කරන වෙලාවට Viewport එක හරිගස්සන්න
        window.addEventListener('resize', () => {
            if (document.activeElement.tagName === 'INPUT') {
                window.setTimeout(() => {
                    document.activeElement.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 100);
            }
        });
    </script>
</body>
</html>
