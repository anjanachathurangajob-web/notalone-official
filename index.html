<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not Alone - Final Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* මුළු Screen එකම පාලනය කරන ප්‍රධාන CSS */
        html, body { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #0a0514; 
            color: white; 
            font-family: sans-serif;
        }

        .app-container { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: -webkit-fill-available;
            width: 100vw; 
        }

        /* HEADER FIX */
        .chat-header { 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 16px; 
            background: rgba(10, 5, 20, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            flex-shrink: 0;
            z-index: 10;
        }

        /* MESSAGE AREA - මේක තමයි මැද කොටස */
        #chat-messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #0a0514;
            -webkit-overflow-scrolling: touch;
        }

        /* INPUT WRAPPER - OVERLAP නොවී යටම තියෙන්න */
        .input-wrapper { 
            padding: 10px 16px; 
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* iPhone වල යට Notch එකට ඉඩ තැබීම */
            background: #0a0514; 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            flex-shrink: 0; 
        }

        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        
        /* Message Bubbles */
        .msg-me { background: #ec4899; align-self: flex-end; border-radius: 18px 18px 2px 18px; }
        .msg-stranger { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-radius: 18px 18px 18px 2px; }
        .msg-bubble { padding: 10px 15px; max-width: 80%; font-size: 14px; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="main-dashboard" class="flex-1 flex flex-col items-center justify-center p-8">
            <div class="w-full flex justify-between items-center absolute top-0 p-6">
                <button onclick="logout()" class="text-[10px] border border-white/20 px-4 py-2 rounded-full uppercase font-bold">Logout / අයින් වන්න</button>
                <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-[10px] font-bold border border-emerald-500/20">
                    <span class="online-count">0</span> ONLINE
                </div>
            </div>
            
            <h1 class="text-6xl font-black italic mb-2 tracking-tighter text-pink-500">NOT ALONE.</h1>
            <p id="days-tag" class="text-[9px] opacity-40 uppercase tracking-widest mb-10">-- Days Remaining</p>
            
            <button onclick="findStranger()" class="w-full btn-gradient p-12 rounded-[2.5rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full">
            <div class="chat-header">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-pink-500 uppercase">Stranger Chat</span>
                    <span class="text-[8px] text-emerald-400 font-bold uppercase online-count">0 Online</span>
                </div>
                <button onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[10px] font-bold uppercase border border-red-500/30">End / අවසන්</button>
            </div>

            <div id="chat-messages">
                </div>

            <div class="input-wrapper">
                <div class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10 shadow-lg">
                    <button id="record-btn" onclick="toggleRecord()" class="bg-white/10 w-11 h-11 rounded-full text-[8px] font-black uppercase">Voice</button>
                    <input id="msg-input" placeholder="Message... පණිවිඩය..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[8px]">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ඔයාගේ පරණ Firebase Config එකම පාවිච්චි කරන්න
        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;

        // Auto-scroll to bottom
        const scrollToBottom = () => {
            const box = document.getElementById('chat-messages');
            box.scrollTop = box.scrollHeight;
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        // Handle Online Status
        if(myUser) {
            onValue(ref(db, 'online'), (s) => {
                const count = s.exists() ? Object.keys(s.val()).length : 0;
                document.querySelectorAll('.online-count').forEach(el => el.innerText = count);
            });
        }

        window.findStranger = async () => {
            // සොයන අතරතුර පෙන්වන UI එක මෙතනට දාන්න පුළුවන්
            // දැනට කෙලින්ම සෙවීම් ආරම්භ කරනවා
            const queueRef = ref(db, `queue/${myUser}`);
            await set(queueRef, { joinedAt: Date.now() });
            
            onValue(ref(db, `online/${myUser}/room`), (s) => {
                if(s.exists()) startChat(s.val());
            });

            const snapshot = await get(ref(db, 'queue'));
            const partner = Object.keys(snapshot.val() || {}).find(u => u !== myUser);

            if(partner) {
                const roomId = [myUser, partner].sort().join("_");
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], active: true },
                    [`online/${myUser}/room`]: roomId,
                    [`online/${partner}/room`]: roomId,
                    [`queue/${myUser}`]: null,
                    [`queue/${partner}`]: null
                });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                if(s.exists()) {
                    Object.values(s.val()).forEach(m => {
                        const isMe = m.sender === myUser;
                        box.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-me' : 'msg-stranger'}">${m.text}</div>`;
                    });
                    scrollToBottom();
                }
            });
        }

        window.sendMsg = () => {
            const input = document.getElementById('msg-input');
            if(!input.value || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), {
                sender: myUser,
                text: input.value,
                time: Date.now()
            });
            input.value = "";
        };

        window.endChat = () => {
            if(currentRoom) remove(ref(db, `rooms/${currentRoom}`));
            location.reload();
        };

        window.onload = async () => {
            if(!myUser) {
                // මෙතනින් Login page එකට යවන්න
                console.log("No User Found");
            }
        };
    </script>
</body>
</html>
