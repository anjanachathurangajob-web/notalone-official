<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not Alone - Real Time Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0514; color: white; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; width: 100vw; }
        .chat-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0a0514; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .input-wrapper { padding: 10px 16px; background: #0a0514; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        .msg-me { background: #ec4899; align-self: flex-end; border-radius: 18px 18px 2px 18px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        .msg-stranger { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-radius: 18px 18px 18px 2px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        .recording { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #finding-overlay { position: fixed; inset: 0; background: #0a0514; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(236, 72, 153, 0.1); border-top: 4px solid #ec4899; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="finding-overlay" class="hidden">
            <div class="loader-ring"></div>
            <p class="text-pink-500 font-bold mt-4 uppercase animate-pulse">Finding a Stranger...</p>
            <button onclick="stopSearch()" class="mt-8 text-[10px] text-white/40 uppercase border border-white/10 px-4 py-2 rounded-full">Cancel</button>
        </div>

        <div id="main-dashboard" class="hidden flex-1 flex flex-col items-center justify-center p-8">
            <div class="w-full flex justify-between absolute top-0 p-6 items-center">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full text-white/40">LOGOUT</button>
                <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-[9px] font-bold online-count">0 ONLINE</div>
            </div>
            <h1 class="text-5xl font-black italic mb-2 text-pink-500 uppercase tracking-tighter">NOT ALONE.</h1>
            <p id="days-tag" class="text-[10px] bg-white/5 px-4 py-1 rounded-full mb-12 font-bold">-- Days Remaining</p>
            <button onclick="findStranger()" class="w-full btn-gradient p-14 rounded-[3rem] font-black text-xl uppercase shadow-2xl active:scale-95">Find Stranger</button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full relative">
            <div class="chat-header">
                <button onclick="endChat()" class="text-[8px] text-white/40 uppercase font-bold">Leave</button>
                <span class="text-[10px] font-black text-pink-500 uppercase">Live Chat</span>
                <button onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase">End</button>
            </div>
            <div id="chat-messages"></div>
            <div class="input-wrapper">
                <div class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10">
                    <button id="voice-btn" class="bg-white/10 w-11 h-11 rounded-full text-[8px] font-black uppercase">Voice</button>
                    <input id="msg-input" placeholder="Type here..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[8px] uppercase">Send</button>
                </div>
            </div>
        </div>

        <div id="login-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center">
             <h1 class="text-4xl font-black text-pink-500 mb-8 italic uppercase">Not Alone</h1>
             <div class="glass-panel p-8 rounded-[2.5rem] w-full max-w-xs">
                <div id="login-box">
                    <input id="login-user" placeholder="Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-white">
                    <input id="login-pass" type="password" placeholder="Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-white">
                    <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase">Login</button>
                    <p onclick="toggleReg(true)" class="text-[10px] mt-6 opacity-30 cursor-pointer">REGISTER</p>
                </div>
                <div id="reg-box" class="hidden">
                    <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-white">
                    <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-white">
                    <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase">Register & WhatsApp</button>
                    <p onclick="toggleReg(false)" class="text-[10px] mt-6 opacity-30 cursor-pointer">BACK</p>
                </div>
             </div>
        </div>

        <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-y-auto bg-black">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-black text-blue-500 uppercase">Admin Panel</h2>
                <button onclick="location.reload()" class="text-[9px] border border-white/20 px-4 py-2 rounded-full uppercase">Exit</button>
            </div>
            <div id="user-list" class="space-y-4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const MY_WHATSAPP = "94773364401";
        
        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let mediaRecorder;
        let audioChunks = [];

        // Setup Online Presence
        if (myUser) {
            const userStatusRef = ref(db, `online/${myUser}`);
            set(userStatusRef, { active: true });
            onDisconnect(userStatusRef).remove();
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
            
            onValue(ref(db, 'online'), (snap) => {
                const count = snap.exists() ? Object.keys(snap.val()).length : 0;
                document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} ONLINE`);
            });
        }

        // Voice Recording
        const voiceBtn = document.getElementById('voice-btn');
        voiceBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            if(currentRoom) push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'voice', data: reader.result });
                        };
                    };
                    mediaRecorder.start();
                    voiceBtn.classList.add('recording');
                    voiceBtn.innerText = "Recording";
                } catch (e) { alert("Mic error!"); }
            } else {
                mediaRecorder.stop();
                voiceBtn.classList.remove('recording');
                voiceBtn.innerText = "Voice";
            }
        };

        // Real-time Matchmaking
        window.findStranger = async () => {
            document.getElementById('finding-overlay').classList.remove('hidden');
            
            const queueRef = ref(db, 'queue');
            const queueSnap = await get(queueRef);
            let partner = null;

            if (queueSnap.exists()) {
                partner = Object.keys(queueSnap.val()).find(u => u !== myUser);
            }

            if (partner) {
                const roomId = `room_${Date.now()}`;
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], active: true },
                    [`queue/${partner}`]: null,
                    [`users/${myUser}/currentRoom`]: roomId,
                    [`users/${partner}/currentRoom`]: roomId
                });
                startChat(roomId);
            } else {
                await set(ref(db, `queue/${myUser}`), true);
                const matchListener = ref(db, `users/${myUser}/currentRoom`);
                onValue(matchListener, (snap) => {
                    if (snap.exists()) {
                        off(matchListener);
                        startChat(snap.val());
                    }
                });
            }
        };

        window.stopSearch = () => {
            remove(ref(db, `queue/${myUser}`));
            location.reload();
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('finding-overlay').classList.add('hidden');
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');

            const msgRef = ref(db, `rooms/${roomId}/messages`);
            onValue(msgRef, (snap) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                if (snap.exists()) {
                    Object.values(snap.val()).forEach(m => {
                        const div = document.createElement('div');
                        div.className = m.sender === myUser ? 'msg-me' : 'msg-stranger';
                        if (m.type === 'voice') {
                            div.innerHTML = `<audio src="${m.data}" controls class="w-40 h-8"></audio>`;
                        } else {
                            div.innerText = m.text;
                        }
                        box.appendChild(div);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });

            onValue(ref(db, `rooms/${roomId}`), snap => {
                if (!snap.exists()) { alert("Stranger disconnected"); location.reload(); }
            });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msg-input');
            if (!inp.value.trim() || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, text: inp.value, type: 'text' });
            inp.value = "";
        };

        window.endChat = () => {
            if (currentRoom) {
                remove(ref(db, `rooms/${currentRoom}`));
                update(ref(db, `users/${myUser}`), { currentRoom: null });
            }
            location.reload();
        };

        // Auth Functions
        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === "admin" && p === "913132386V") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p && s.val().approved) {
                localStorage.setItem('chatUser', u); location.reload();
            } else alert("Login failed or not approved!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return;
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: Date.now() + 2592000000 });
            window.location.href = `https://wa.me/${MY_WHATSAPP}?text=Approve%20User:%20${u}`;
        };

        window.logout = () => { localStorage.clear(); location.reload(); };
        window.toggleReg = (s) => {
            document.getElementById('login-box').classList.toggle('hidden', s);
            document.getElementById('reg-box').classList.toggle('hidden', !s);
        };

        // Admin (Delete Logic Included)
        function loadAdminData() {
            onValue(ref(db, 'users'), snap => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                if(snap.exists()){
                    Object.entries(snap.val()).forEach(([u, d]) => {
                        if(u === "admin") return;
                        const div = document.createElement('div');
                        div.className = "p-4 glass-panel rounded-2xl flex justify-between items-center";
                        div.innerHTML = `<div><p class="font-bold">${u}</p></div>
                            <div class="flex gap-2">
                                <button onclick="approveUser('${u}')" class="bg-emerald-600 px-3 py-1 rounded-lg text-[10px]">Approve</button>
                                <button onclick="deleteUser('${u}')" class="bg-red-600 px-3 py-1 rounded-lg text-[10px]">Del</button>
                            </div>`;
                        list.appendChild(div);
                    });
                }
            });
        }
        window.approveUser = u => update(ref(db, `users/${u}`), { approved: true });
        window.deleteUser = u => { if(confirm(`Delete ${u}?`)) remove(ref(db, `users/${u}`)); };

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()){
                    const d = Math.ceil((s.val().expiry - Date.now())/86400000);
                    document.getElementById('days-tag').innerText = (d > 0 ? d : 0) + " Days Remaining";
                    document.getElementById('main-dashboard').classList.remove('hidden');
                } else logout();
            } else document.getElementById('login-screen').classList.remove('hidden');
        };
    </script>
</body>
</html>
