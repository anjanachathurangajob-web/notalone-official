<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Alone - High Speed Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; background: #0a0514; color: white; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .input-wrapper { padding: 15px; background: #0a0514; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        /* Faster Pulse for Searching */
        .searching-pulse { animation: pulse-fast 1s infinite; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="main-dashboard" class="flex-1 flex flex-col justify-center p-8">
            <h1 class="text-5xl font-black italic mb-2">NOT<br><span class="text-pink-500">ALONE.</span></h1>
            <div class="flex items-center gap-2 mb-10">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                <span class="online-count text-[10px] text-emerald-400 font-bold uppercase">Checking Online...</span>
            </div>
            <button onclick="findStranger()" class="btn-gradient p-12 rounded-[2.5rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
            <p id="days-tag" class="mt-6 text-[9px] opacity-40 uppercase tracking-widest text-center">-- Days Remaining</p>
        </div>

        <div id="searching-ui" class="hidden flex-1 flex flex-col items-center justify-center text-center p-6">
            <div class="relative">
                <div class="w-24 h-24 border-4 border-pink-500/20 rounded-full"></div>
                <div class="absolute inset-0 w-24 h-24 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <h2 class="mt-8 text-xl font-black italic searching-pulse">CONNECTING...</h2>
            <p class="mt-2 text-white/40 text-xs uppercase tracking-widest">සෙට් වෙනකම් පොඩ්ඩක් ඉන්න...</p>
            <button onclick="location.reload()" class="mt-12 text-[10px] opacity-30 underline uppercase font-bold">Cancel Search</button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full">
            <div class="p-4 flex justify-between items-center border-b border-white/5">
                <span class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">Connected with Stranger</span>
                <button onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase">End</button>
            </div>
            <div id="chat-messages"></div>
            <div class="input-wrapper">
                <div class="flex gap-2 items-center bg-white/5 p-2 rounded-full border border-white/10">
                    <button id="record-btn" onclick="toggleRecord()" class="w-10 h-10 rounded-full bg-white/10 text-[8px] font-bold">MIC</button>
                    <input id="msg-input" placeholder="Type here..." class="flex-1 bg-transparent px-2 outline-none text-sm">
                    <button onclick="sendMsg()" class="btn-gradient w-10 h-10 rounded-full text-[8px] font-bold">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let searchTimeout;

        // Sync Online Status
        if(myUser) {
            onValue(ref(db, 'online'), (s) => {
                const count = s.exists() ? Object.keys(s.val()).length : 0;
                document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online Now`);
            });
        }

        window.findStranger = async () => {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('searching-ui').classList.remove('hidden');

            // 1. Listen for dynamic room assignment
            const roomRef = ref(db, `online/${myUser}/room`);
            const unsub = onValue(roomRef, (s) => {
                if(s.exists() && s.val()) {
                    clearTimeout(searchTimeout);
                    unsub();
                    startChat(s.val());
                }
            });

            // 2. Try to Match
            const snapshot = await get(ref(db, 'queue'));
            const partner = snapshot.exists() ? Object.keys(snapshot.val()).find(u => u !== myUser) : null;

            if (partner) {
                const roomId = [myUser, partner].sort().join("_");
                await remove(ref(db, `queue/${partner}`));
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], activeUsers: [myUser, partner], createdAt: Date.now() },
                    [`online/${myUser}`]: { status: "chatting", room: roomId },
                    [`online/${partner}`]: { status: "chatting", room: roomId }
                });
            } else {
                await set(ref(db, `queue/${myUser}`), { joinedAt: Date.now() });
                // If no match in 15 seconds, refresh queue
                searchTimeout = setTimeout(() => {
                    remove(ref(db, `queue/${myUser}`));
                    findStranger(); 
                }, 15000);
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('searching-ui').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                if(s.exists()){
                    Object.values(s.val()).forEach(m => {
                        const isMe = m.sender === myUser;
                        box.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="${isMe ? 'bg-pink-600' : 'bg-white/10'} p-3 rounded-2xl max-w-[80%] text-sm">${m.text || 'Voice Message'}</div>
                        </div>`;
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msg-input');
            if(!inp.value || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, text: inp.value, time: Date.now() });
            inp.value = "";
        };

        window.endChat = async () => {
            if(currentRoom) await remove(ref(db, `rooms/${currentRoom}`));
            location.reload();
        };

        window.onload = async () => {
            if(!myUser) return window.location.href = "login.html"; // Redirect if no user
            const s = await get(ref(db, `users/${myUser}`));
            if(s.exists()){
                const expiry = s.val().expiry;
                const days = Math.ceil((expiry - Date.now()) / 86400000);
                document.getElementById('days-tag').innerText = (days > 0 ? days : 0) + " Days Subscription Remaining";
            }
        };
    </script>
</body>
</html>
