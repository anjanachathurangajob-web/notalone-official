<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Official Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #0a0514; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        .approved-bg { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ADMIN_USER = "admin";
        const ADMIN_PW = "913132386V";
        const MY_WHATSAPP = "94773364401";

        let myUser = localStorage.getItem('chatUser');

        if(myUser) {
            set(ref(db, `online/${myUser}`), true);
            onDisconnect(ref(db, `online/${myUser}`)).remove();
        }
        onValue(ref(db, 'online'), (s) => {
            const count = s.exists() ? Object.keys(s.val()).length : 0;
            document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
        });

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            window.open(`https://wa.me/${MY_WHATSAPP}?text=New user request: ${u}`, '_blank');
            alert("Requested!");
        };

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === ADMIN_USER && p === ADMIN_PW) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData();
                return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u);
                    location.reload();
                } else { alert("Expired or Pending!"); }
            } else { alert("Invalid Credentials"); }
        };

        // ADMIN FUNCTIONS
        window.approveUser = async (u) => {
            await update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + (30*24*60*60*1000) });
        };

        window.deleteUser = async (u) => {
            if(confirm(`Are you sure you want to delete ${u}?`)) {
                await remove(ref(db, `users/${u}`));
            }
        };

        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                if(s.exists()){
                    Object.entries(s.val()).forEach(([u, d]) => {
                        const isApproved = d.approved && Date.now() < d.expiry;
                        list.innerHTML += `
                            <div class="p-4 rounded-xl mb-3 flex justify-between items-center ${isApproved ? 'approved-bg' : 'glass-panel'}">
                                <div>
                                    <p class="font-bold text-sm ${isApproved ? 'text-emerald-400' : 'text-white'}">${u}</p>
                                    <p class="text-[10px] opacity-60">PW: ${d.password} | Exp: ${d.expiry ? new Date(d.expiry).toLocaleDateString() : 'N/A'}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="approveUser('${u}')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-[9px] font-black uppercase">Approve</button>
                                    <button onclick="deleteUser('${u}')" class="bg-red-600 hover:bg-red-500 px-3 py-2 rounded-lg text-[9px] font-black uppercase tracking-tighter">Delete</button>
                                </div>
                            </div>`;
                    });
                }
            });
        }

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()) document.getElementById('expire-tag').innerText = "Expire: " + new Date(s.val().expiry).toLocaleDateString();
                document.getElementById('main-dashboard').classList.remove('hidden');
            } else { document.getElementById('login-screen').classList.remove('hidden'); }
        };
        window.logout = () => { localStorage.removeItem('chatUser'); location.reload(); };
    </script>

    <!-- UI -->
    <div id="login-screen" class="hidden flex-1 flex flex-col justify-center max-w-sm mx-auto">
        <h1 class="text-4xl font-black text-pink-500 mb-8 text-center uppercase">NOT ALONE</h1>
        <div class="glass-panel p-8 rounded-3xl">
            <div id="login-form">
                <input id="login-user" placeholder="Username" class="w-full bg-white/5 p-4 mb-4 rounded-xl outline-none text-sm">
                <input id="login-pass" type="password" placeholder="Password" class="w-full bg-white/5 p-4 mb-6 rounded-xl outline-none text-sm">
                <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-xl font-bold uppercase">Login</button>
                <p class="text-center text-[10px] opacity-40 mt-4 uppercase cursor-pointer" onclick="document.getElementById('login-form').classList.add('hidden'); document.getElementById('reg-form').classList.remove('hidden');">New account? Register</p>
            </div>
            <div id="reg-form" class="hidden">
                <input id="reg-user" placeholder="Create Username" class="w-full bg-white/5 p-4 mb-2 rounded-xl outline-none text-sm">
                <input id="reg-pass" placeholder="Create Password" class="w-full bg-white/5 p-4 mb-4 rounded-xl outline-none text-sm">
                <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold uppercase">Register</button>
                <p class="text-center text-[10px] opacity-40 mt-4 uppercase cursor-pointer" onclick="document.getElementById('reg-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden');">Back to Login</p>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden flex-1 flex flex-col justify-center">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-5xl font-black italic leading-[0.8]">NOT<br><span class="text-pink-500 uppercase">ALONE.</span></h1>
            <div class="flex flex-col items-end gap-2">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold">Logout</button>
                <div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full">
                    <div class="online-dot animate-pulse"></div><span class="online-count text-[10px] font-bold text-emerald-400">0 Online</span>
                </div>
            </div>
        </div>
        <p id="expire-tag" class="text-pink-400 font-black mb-8 uppercase text-[10px] bg-pink-500/10 self-start px-4 py-1 rounded-full border border-pink-500/20">Expire: --</p>
        <button class="w-full btn-gradient p-12 rounded-[2.5rem] font-black text-2xl uppercase">Find Stranger →</button>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-blue-500 uppercase">Admin</h2>
            <button onclick="location.reload()" class="bg-white/10 px-3 py-1 rounded-full text-[9px] font-bold uppercase">Exit</button>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

</body>
</html>
