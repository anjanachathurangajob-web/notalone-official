<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Alone - Private Chat</title> 
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0514; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        #chat-messages::-webkit-scrollbar { width: 0; }
        .recording { animation: pulse 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .chat-input-area { position: fixed; bottom: 20px; left: 24px; right: 24px; z-index: 50; }
        .chat-container { padding-bottom: 90px; }
    </style>
</head>
<body class="p-6">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ADMIN_USER = "admin";
        const ADMIN_PW = "913132386V";
        const MY_WHATSAPP = "94773364401";
        
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let mediaRecorder;
        let audioChunks = [];
        let lastMsgCount = 0;

        window.logout = () => { localStorage.clear(); location.reload(); };

        if(myUser) {
            set(ref(db, `online/${myUser}`), { status: "idle" });
            onDisconnect(ref(db, `online/${myUser}`)).remove();
            onDisconnect(ref(db, `queue/${myUser}`)).remove();
        }

        onValue(ref(db, 'online'), (s) => {
            const count = s.exists() ? Object.keys(s.val()).length : 0;
            document.querySelectorAll('.online-count').forEach(el => el.innerText = `${count} Online`);
        });

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === ADMIN_USER && p === ADMIN_PW) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u); location.reload();
                } else alert("Account Not Approved!");
            } else alert("Invalid Login!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return alert("Fill all fields!");
            const check = await get(ref(db, `users/${u}`));
            if(check.exists()) return alert("Username used!");
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            const msg = `Hi Admin, I just registered on Not Alone.\nUsername: ${u}\nPlease approve my account.`;
            window.open(`https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(msg)}`);
            location.reload();
        };

        window.findStranger = async () => {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('searching-ui').classList.remove('hidden');
            lastMsgCount = 0;

            const queueRef = ref(db, 'queue');
            const myQueueRef = ref(db, `queue/${myUser}`);

            const unsubRoom = onValue(ref(db, `online/${myUser}/room`), (s) => {
                if(s.exists() && s.val()) {
                    remove(myQueueRef);
                    startChat(s.val());
                    unsubRoom();
                }
            });

            const snapshot = await get(queueRef);
            const queue = snapshot.val() || {};
            const partner = Object.keys(queue).find(u => u !== myUser);

            if (partner) {
                const roomId = [myUser, partner].sort().join("_");
                await remove(ref(db, `queue/${partner}`));
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], activeUsers: [myUser, partner], createdAt: Date.now() },
                    [`online/${myUser}`]: { status: "chatting", room: roomId },
                    [`online/${partner}`]: { status: "chatting", room: roomId }
                });
            } else {
                await set(myQueueRef, { joinedAt: Date.now() });
                await update(ref(db, `online/${myUser}`), { status: "searching", room: null });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('searching-ui').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                const msgBox = document.getElementById('chat-messages');
                msgBox.innerHTML = "";
                if(s.exists()) {
                    const messages = Object.values(s.val());
                    if(messages.length > lastMsgCount) {
                        const lastMsg = messages[messages.length - 1];
                        if(lastMsg.sender !== myUser) {
                            msgSound.play().catch(e => console.log("Sound error:", e));
                        }
                    }
                    lastMsgCount = messages.length;
                    messages.forEach(m => {
                        const isMe = m.sender === myUser;
                        let content = m.type === 'text' ? m.text : `<audio controls class="h-8 w-40"><source src="${m.audio}" type="audio/webm"></audio>`;
                        msgBox.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                            <div class="${isMe ? 'bg-pink-600' : 'bg-white/10'} p-3 rounded-2xl max-w-[80%] text-sm">${content}</div>
                        </div>`;
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });

            onValue(ref(db, `rooms/${roomId}/activeUsers`), (s) => {
                if(s.exists()) {
                    const active = s.val();
                    if (active.length < 2 && active.includes(myUser)) {
                        const msgBox = document.getElementById('chat-messages');
                        if (!document.getElementById('left-msg')) {
                            msgBox.innerHTML += `
                                <div id="left-msg" class="text-center my-6">
                                    <p class="text-red-400 text-[10px] uppercase font-bold mb-3 tracking-widest opacity-60">Partner has left the chat</p>
                                    <button onclick="findStranger()" class="btn-gradient px-6 py-2 rounded-full text-[10px] font-black uppercase shadow-lg">New Chat / නව චැට් එකක්</button>
                                </div>`;
                            msgBox.scrollTop = msgBox.scrollHeight;
                            currentRoom = null;
                        }
                    }
                }
            });
        }

        window.toggleRecord = async () => {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => { if(currentRoom) push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'voice', audio: reader.result, time: Date.now() }); };
                };
                mediaRecorder.start();
                btn.classList.add('recording'); btn.innerText = "REC";
            } else { mediaRecorder.stop(); btn.classList.remove('recording'); btn.innerText = "VOICE"; }
        };

        window.sendMsg = () => {
            const val = document.getElementById('msg-input').value.trim();
            if(!val || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'text', text: val, time: Date.now() });
            document.getElementById('msg-input').value = "";
        };

        window.endChat = async () => {
            if(!currentRoom) { location.reload(); return; }
            const roomRef = ref(db, `rooms/${currentRoom}`);
            const snapshot = await get(roomRef);
            if(snapshot.exists()) {
                let active = snapshot.val().activeUsers || [];
                active = active.filter(u => u !== myUser);
                active.length === 0 ? await remove(roomRef) : await update(roomRef, { activeUsers: active });
            }
            await update(ref(db, `online/${myUser}`), { status: "idle", room: null });
            location.reload();
        };

        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list'); list.innerHTML = "";
                Object.entries(s.val()).forEach(([u, d]) => {
                    const isApproved = d.approved === true;
                    list.innerHTML += `<div class="p-4 rounded-xl mb-3 flex justify-between items-center ${isApproved ? 'bg-emerald-500/20 border border-emerald-500/30' : 'glass-panel'}">
                        <div><p class="font-bold text-sm ${isApproved ? 'text-emerald-400' : 'text-white'}">${u}</p><p class="text-[9px] opacity-60">PW: ${d.password}</p></div>
                        <div class="flex gap-2">
                            <button onclick="approveUser('${u}')" class="bg-emerald-600 px-3 py-1 rounded-lg text-[9px] font-bold uppercase">Approve</button>
                            <button onclick="deleteUser('${u}')" class="bg-red-600 px-3 py-1 rounded-lg text-[9px] font-bold uppercase">Del</button>
                        </div>
                    </div>`;
                });
            });
        }
        window.approveUser = (u) => update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + 2592000000 });
        window.deleteUser = (u) => remove(ref(db, `users/${u}`));

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()) {
                    const days = Math.ceil((s.val().expiry - Date.now()) / 86400000);
                    document.getElementById('days-tag').innerText = (days > 0 ? days : 0) + " Days Remaining";
                    document.getElementById('main-dashboard').classList.remove('hidden');
                } else { logout(); }
            } else document.getElementById('login-screen').classList.remove('hidden');
        };
    </script>

    <div id="searching-ui" class="hidden flex-1 flex flex-col justify-center items-center text-center">
        <div class="w-16 h-16 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold animate-pulse text-xs uppercase tracking-widest">Stranger කෙනෙක් සොයමින්...<br>Finding Stranger...</p>
        <button onclick="location.reload()" class="mt-10 text-[10px] opacity-40 underline uppercase font-bold">Cancel / අවලංගු කරන්න</button>
    </div>

    <div id="chat-screen" class="hidden flex-1 flex flex-col chat-container">
        <div class="flex justify-between items-center pb-3 border-b border-white/10">
            <button onclick="logout()" class="text-[9px] text-white/40 uppercase font-bold">Logout / අයින් වෙන්න</button>
            <button onclick="endChat()" class="bg-red-500/10 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/20">End Chat / අවසන් කරන්න</button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto py-4 px-2"></div>
        <div class="chat-input-area">
            <div class="flex gap-2 items-center bg-[#1a1425] p-2 rounded-[2rem] border border-white/10 shadow-2xl">
                <button id="record-btn" onclick="toggleRecord()" class="bg-white/10 w-12 h-12 rounded-full text-[8px] font-black uppercase">Voice</button>
                <input id="msg-input" placeholder="Message... පණිවිඩයක්..." class="flex-1 bg-transparent p-2 outline-none text-sm">
                <button onclick="sendMsg()" class="btn-gradient w-12 h-12 rounded-full font-black text-[8px]">SEND</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden flex-1 flex flex-col justify-center max-w-sm mx-auto">
        <h1 class="text-center text-4xl font-black text-pink-500 mb-8 italic uppercase">Not Alone</h1>
        <div class="glass-panel p-8 rounded-[2.5rem]">
            <div id="login-box">
                <input id="login-user" placeholder="Username (පරිශීලක නාමය)" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                <input id="login-pass" type="password" placeholder="Password (මුරපදය)" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase shadow-lg">Login / ඇතුල් වන්න</button>
                <p onclick="document.getElementById('login-box').classList.add('hidden'); document.getElementById('reg-box').classList.remove('hidden');" class="text-center text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">New? Register Here / ලියාපදිංචි වන්න</p>
            </div>
            <div id="reg-box" class="hidden">
                <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm">
                <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm">
                <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase">Register / ලියාපදිංචි වන්න</button>
                <p onclick="document.getElementById('reg-box').classList.add('hidden'); document.getElementById('login-box').classList.remove('hidden');" class="text-center text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">Back to Login / ආපසු</p>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden flex-1 flex flex-col justify-center">
        <div class="flex justify-between items-start mb-8">
            <h1 class="text-5xl font-black italic leading-none uppercase tracking-tighter">NOT<br><span class="text-pink-500">ALONE.</span></h1>
            <div class="flex flex-col items-end gap-2">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold">Logout / අයින් වෙන්න</button>
                <div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5">
                    <div class="online-dot animate-pulse"></div><span class="online-count text-[9px] text-emerald-400 font-bold uppercase">0 Online</span>
                </div>
            </div>
        </div>
        <p id="days-tag" class="text-[9px] bg-emerald-500/10 text-emerald-400 px-4 py-1 rounded-full self-start mb-10 border border-emerald-500/20 font-black uppercase">-- Days</p>
        <button onclick="findStranger()" class="btn-gradient p-14 rounded-[3rem] font-black text-2xl uppercase shadow-2xl active:scale-95 transition-all">Find Stranger →</button>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-blue-500 uppercase italic">Admin Panel</h2>
            <div class="flex gap-2">
                <button onclick="logout()" class="text-[9px] bg-red-500/20 text-red-500 px-3 py-1 rounded-full uppercase font-bold">Logout</button>
                <button onclick="location.reload()" class="text-[9px] bg-white/10 px-3 py-1 rounded-full uppercase font-bold">Exit</button>
            </div>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

</body>
</html>
