<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not Alone - Voice Enabled</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0514; color: white; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; width: 100vw; }
        .chat-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0a0514; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .input-wrapper { padding: 10px 16px; background: #0a0514; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .btn-gradient { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none !important; }
        .msg-me { background: #ec4899; align-self: flex-end; border-radius: 18px 18px 2px 18px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        .msg-stranger { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-radius: 18px 18px 18px 2px; padding: 10px 15px; max-width: 80%; font-size: 14px; }
        .recording { animation: pulse 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        #finding-overlay { position: fixed; inset: 0; background: #0a0514; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader-ring { width: 80px; height: 80px; border: 4px solid rgba(236, 72, 153, 0.1); border-top: 4px solid #ec4899; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #left-alert-box { position: absolute; top: 70px; left: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; border-radius: 2rem; background: rgba(255, 0, 0, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255,0,0,0.3); text-align: center; }
        .system-msg { align-self: center; background: rgba(16, 185, 129, 0.1); color: #10b981; font-size: 10px; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="finding-overlay" class="hidden">
            <button onclick="location.reload()" class="absolute top-5 left-5 text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold text-white/40">Cancel</button>
            <div class="loader-ring"></div>
            <h2 class="text-xl font-black italic text-pink-500 uppercase">Searching...</h2>
        </div>

        <div id="main-dashboard" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="w-full flex justify-between absolute top-0 p-6 items-center">
                <button onclick="logout()" class="text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase font-bold text-white/40">Logout</button>
                <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-[9px] font-bold border border-emerald-500/20 online-count">0 ONLINE</div>
            </div>
            <h1 class="text-6xl font-black italic mb-2 text-pink-500 uppercase tracking-tighter">NOT ALONE.</h1>
            <p id="days-tag" class="text-[10px] bg-white/5 px-4 py-1 rounded-full mb-12 font-bold tracking-widest">-- Days Remaining</p>
            <button onclick="findStranger()" class="w-full btn-gradient p-14 rounded-[3rem] font-black text-xl uppercase shadow-2xl active:scale-95">Find Stranger<br><span class="text-sm opacity-70">හිතවතෙකු සොයන්න</span></button>
        </div>

        <div id="chat-screen" class="hidden flex flex-col h-full relative">
            <div id="left-alert-box" class="hidden">
                <h2 class="text-2xl font-black text-red-500 uppercase italic">Stranger Left!</h2>
                <button onclick="location.reload()" class="btn-gradient w-full py-4 rounded-3xl font-black text-sm uppercase mt-6">New Chat</button>
            </div>

            <div class="chat-header">
                <button onclick="logout()" class="text-[8px] text-white/40 uppercase font-bold">Logout</button>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-black text-pink-500 uppercase">Chatting</span>
                    <span class="text-[8px] text-emerald-400 font-bold online-count">0 Online</span>
                </div>
                <button id="end-btn" onclick="endChat()" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[9px] font-bold uppercase border border-red-500/30">End Chat</button>
            </div>

            <div id="chat-messages"></div>

            <div class="input-wrapper">
                <div id="input-container" class="flex gap-2 items-center bg-white/5 p-2 rounded-[2rem] border border-white/10">
                    <button id="voice-btn" class="bg-white/10 w-11 h-11 rounded-full text-[7px] font-black uppercase flex items-center justify-center">Voice</button>
                    <input id="msg-input" placeholder="Type here..." class="flex-1 bg-transparent p-2 outline-none text-sm text-white">
                    <button onclick="sendMsg()" class="btn-gradient w-11 h-11 rounded-full font-black text-[7px] uppercase">Send</button>
                </div>
            </div>
        </div>

        <div id="login-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6">
            <h1 class="text-4xl font-black text-pink-500 mb-8 italic uppercase">Not Alone</h1>
            <div class="glass-panel p-8 rounded-[2.5rem] w-full max-w-xs text-center">
                <div id="login-box">
                    <input id="login-user" placeholder="Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="login-pass" type="password" placeholder="Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleLogin()" class="w-full btn-gradient py-4 rounded-2xl font-bold uppercase">Login</button>
                    <p onclick="toggleReg(true)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">Register</p>
                </div>
                <div id="reg-box" class="hidden">
                    <input id="reg-user" placeholder="New Username" class="w-full bg-white/5 p-4 mb-3 rounded-2xl outline-none text-sm border border-white/5">
                    <input id="reg-pass" placeholder="New Password" class="w-full bg-white/5 p-4 mb-5 rounded-2xl outline-none text-sm border border-white/5">
                    <button onclick="handleRegister()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold uppercase text-[11px]">Register & WhatsApp</button>
                    <p onclick="toggleReg(false)" class="text-[10px] mt-6 opacity-30 cursor-pointer uppercase font-bold">Back</p>
                </div>
            </div>
        </div>

        <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-y-auto bg-black">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-black text-blue-500 uppercase italic">Admin Panel</h2>
                <button onclick="location.reload()" class="text-[9px] border border-white/20 px-4 py-2 rounded-full uppercase font-bold">Exit Admin</button>
            </div>
            <div id="user-list" class="space-y-4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, update, onDisconnect, remove, push, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const MY_WHATSAPP = "94773364401";
        
        let myUser = localStorage.getItem('chatUser');
        let currentRoom = null;
        let mediaRecorder;
        let audioChunks = [];

        // Authentication & Navigation
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.toggleReg = (s) => {
            document.getElementById('login-box').classList.toggle('hidden', s);
            document.getElementById('reg-box').classList.toggle('hidden', !s);
        };

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === "admin" && p === "913132386V") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData(); return;
            }
            const s = await get(ref(db, `users/${u}`));
            if(s.exists() && s.val().password === p) {
                if(s.val().approved && Date.now() < s.val().expiry) {
                    localStorage.setItem('chatUser', u); location.reload();
                } else alert("Not Approved!");
            } else alert("Login Failed!");
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if(!u || !p) return;
            await set(ref(db, `users/${u}`), { password: p, approved: false, expiry: 0 });
            window.location.href = `https://wa.me/${MY_WHATSAPP}?text=Approve%20user:%20${u}`;
        };

        // Voice Recording Logic
        const voiceBtn = document.getElementById('voice-btn');
        voiceBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        if(currentRoom) push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, type: 'voice', audio: base64Audio });
                    };
                };
                mediaRecorder.start();
                voiceBtn.classList.add('recording');
                voiceBtn.innerText = "Stop";
            } else {
                mediaRecorder.stop();
                voiceBtn.classList.remove('recording');
                voiceBtn.innerText = "Voice";
            }
        };

        // Chat Logic
        window.findStranger = async () => {
            document.getElementById('finding-overlay').classList.remove('hidden');
            const queueSnap = await get(ref(db, 'queue'));
            let partner = queueSnap.exists() ? Object.keys(queueSnap.val()).find(u => u !== myUser) : null;

            if (partner) {
                const roomId = [myUser, partner].sort().join("_");
                await update(ref(db), {
                    [`rooms/${roomId}`]: { users: [myUser, partner], active: true },
                    [`online/${myUser}/room`]: roomId,
                    [`online/${partner}/room`]: roomId,
                    [`queue/${partner}`]: null
                });
                startChat(roomId);
            } else {
                await set(ref(db, `queue/${myUser}`), { joinedAt: Date.now() });
                onValue(ref(db, `online/${myUser}/room`), (s) => { if(s.exists()) startChat(s.val()); }, { onlyOnce: true });
            }
        };

        function startChat(roomId) {
            currentRoom = roomId;
            document.getElementById('finding-overlay').classList.add('hidden');
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            onValue(ref(db, `rooms/${roomId}/messages`), (s) => {
                const msgBox = document.getElementById('chat-messages');
                msgBox.innerHTML = '<div class="system-msg">Connected</div>';
                if(s.exists()){
                    Object.values(s.val()).forEach(m => {
                        const isMe = m.sender === myUser;
                        let content = m.text;
                        if(m.type === 'voice') content = `<audio controls src="${m.audio}" class="max-w-full"></audio>`;
                        msgBox.innerHTML += `<div class="${isMe ? 'msg-me' : 'msg-stranger'}">${content}</div>`;
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });

            onValue(ref(db, `rooms/${roomId}`), s => { if(!s.exists()) document.getElementById('left-alert-box').classList.remove('hidden'); });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msg-input');
            if(!inp.value || !currentRoom) return;
            push(ref(db, `rooms/${currentRoom}/messages`), { sender: myUser, text: inp.value, type: 'text' });
            inp.value = "";
        };

        window.endChat = () => { if(currentRoom) remove(ref(db, `rooms/${currentRoom}`)); location.reload(); };

        // Admin Logic
        function loadAdminData() {
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list'); list.innerHTML = "";
                if(s.exists()) {
                    Object.entries(s.val()).forEach(([u, d]) => {
                        if(u === "admin") return;
                        const isApproved = d.approved && Date.now() < d.expiry;
                        const div = document.createElement('div');
                        div.className = `p-4 glass-panel rounded-2xl flex justify-between items-center border ${isApproved ? 'border-emerald-500/50' : 'border-white/5'}`;
                        div.innerHTML = `<div><p class="font-bold">${u}</p><p class="text-[8px] opacity-40">${isApproved ? 'ACTIVE' : 'PENDING'}</p></div>
                            <div class="flex gap-2">
                                <button onclick="approveUser('${u}')" class="bg-emerald-600 px-3 py-2 rounded-xl text-[10px] font-black uppercase">${isApproved ? 'Extend' : 'Approve'}</button>
                                <button onclick="deleteUser('${u}')" class="bg-red-500/20 text-red-500 border border-red-500/30 px-3 py-2 rounded-xl text-[10px] font-black uppercase">Del</button>
                            </div>`;
                        list.appendChild(div);
                    });
                }
            });
        }
        window.approveUser = u => update(ref(db, `users/${u}`), { approved: true, expiry: Date.now() + 2592000000 });
        window.deleteUser = u => { if(confirm(`Delete ${u}?`)) remove(ref(db, `users/${u}`)); };

        window.onload = async () => {
            if(myUser) {
                const s = await get(ref(db, `users/${myUser}`));
                if(s.exists()){
                    const d = Math.ceil((s.val().expiry - Date.now())/86400000);
                    document.getElementById('days-tag').innerText = (d > 0 ? d : 0) + " Days Remaining";
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    set(ref(db, `online/${myUser}`), { status: "idle" });
                } else logout();
            } else document.getElementById('login-screen').classList.remove('hidden');
        };
    </script>
</body>
</html>
